services:
  spinbot:
    build: .
    container_name: spinbot
    restart: always
    env_file: .env
    environment:
      DB_PATH: /app/data/spin.db
      BACKUP_DIR: /app/backups
    ports:
      - "127.0.0.1:8010:8010"   # localhost only, nginx is the public side
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./backups:/app/backups
    mem_limit: 400m
