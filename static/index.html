<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Spin the Bottle</title>
<link rel="stylesheet" href="/static/style.css?v=108">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="app">
  <section id="table">
    <div id="hud">
      <button id="btn-hearts" class="hearts-btn">
        <svg class="hs" viewBox="0 0 64 58"><defs><linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a2e"/><stop offset="1" stop-color="#e5461b"/></linearGradient></defs><path d="M32 55C10 40 2 28 2 17 2 8 9 2 17 2c6 0 11 3 15 9 4-6 9-9 15-9 8 0 15 6 15 15 0 11-8 23-30 38z" fill="url(#hg)" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/><path d="M13 14c2-4 6-6 10-5" stroke="#fff" stroke-opacity=".65" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
        <b id="hearts">0</b>
      </button>
      <div class="side">
        <button id="btn-wheel" class="round" style="--y:28.6;--cx:29.1"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.4"/><path d="M12 3v6.6M12 14.4V21M3 12h6.6M14.4 12H21M5.6 5.6l4.7 4.7M13.7 13.7l4.7 4.7M18.4 5.6l-4.7 4.7M10.3 13.7l-4.7 4.7"/></svg></button>
        <button id="btn-rating" class="round" style="--y:42.8;--cx:43.1"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3M12 14v4M8 21h8M9 18h6"/></svg></button>
        <button id="btn-menu" class="round" style="--y:57;--cx:57"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <button id="btn-settings" class="round" style="--y:71;--cx:70.9"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8"/></svg></button>
        <button id="btn-table" class="round tbl" style="--y:85.5;--cx:94.1"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14-4.5L4 9M4 4v5h5M4 13a8 8 0 0 0 14 4.5L20 15M20 20v-5h-5"/></svg><b id="tbl-n" class="hidden"></b><small id="table-no"></small></button>
      </div>
      <button id="btn-daily" class="gift-badge hidden">🎁</button>
      <button id="btn-starter" class="starter-chip hidden">🎯 <b></b></button>
      <button id="btn-dtask" class="starter-chip dt hidden">📅 <b></b></button>
      <button id="btn-event" class="starter-chip ev hidden"></button>
    </div>
    <div id="felt">
      <svg id="ornament" viewBox="-104 -104 208 208" aria-hidden="true">
        <defs>
          <linearGradient id="og" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9a74a"/><stop offset=".55" stop-color="#dc9840"/><stop offset="1" stop-color="#cf8836"/></linearGradient>
          <linearGradient id="og2" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3a041"/><stop offset="1" stop-color="#d28c37"/></linearGradient>
          <path id="arm" d="M-15 -20C-15 -42 -27 -56 -23 -76C-18 -90 -6 -94 0 -101C6 -94 18 -90 23 -76C27 -56 15 -42 15 -20Z"/>
          <path id="lobe" d="M0 -24C-28 -40 -50 -62 -36 -86C-26 -98 -6 -92 0 -76C6 -92 26 -98 36 -86C50 -62 28 -40 0 -24Z"/>
        </defs>
        <g fill="rgba(110,50,0,.32)" transform="translate(2.4 3.4)">
          <use href="#arm"/><use href="#arm" transform="rotate(90)"/><use href="#arm" transform="rotate(180)"/><use href="#arm" transform="rotate(270)"/>
          <use href="#lobe" transform="rotate(45)"/><use href="#lobe" transform="rotate(135)"/><use href="#lobe" transform="rotate(225)"/><use href="#lobe" transform="rotate(315)"/>
        </g>
        <g filter="url(#bevel)">
          <g fill="#bf7424" stroke="#8a4d0c" stroke-opacity=".45" stroke-width="1.6" stroke-linejoin="round" transform="scale(1.035)">
            <use href="#arm"/><use href="#arm" transform="rotate(90)"/><use href="#arm" transform="rotate(180)"/><use href="#arm" transform="rotate(270)"/>
          </g>
          <g fill="url(#og2)" stroke="#9a5a14" stroke-opacity=".7" stroke-width="1.5" stroke-linejoin="round">
            <use href="#arm"/><use href="#arm" transform="rotate(90)"/><use href="#arm" transform="rotate(180)"/><use href="#arm" transform="rotate(270)"/>
          </g>
          <g fill="url(#og)" stroke="#9a5a14" stroke-opacity=".75" stroke-width="1.6" stroke-linejoin="round">
            <use href="#lobe" transform="rotate(45)"/><use href="#lobe" transform="rotate(135)"/><use href="#lobe" transform="rotate(225)"/><use href="#lobe" transform="rotate(315)"/>
          </g>
          <g fill="none" stroke="#b9691a" stroke-opacity=".38" stroke-width="1.2" stroke-linecap="round">
            <path d="M-8 -34C-4 -52 4 -60 0 -88M8 -34C4 -52 -4 -60 0 -88" transform="rotate(0)"/><path d="M-8 -34C-4 -52 4 -60 0 -88M8 -34C4 -52 -4 -60 0 -88" transform="rotate(90)"/><path d="M-8 -34C-4 -52 4 -60 0 -88M8 -34C4 -52 -4 -60 0 -88" transform="rotate(180)"/><path d="M-8 -34C-4 -52 4 -60 0 -88M8 -34C4 -52 -4 -60 0 -88" transform="rotate(270)"/>
            <path d="M-10 -36C-24 -52 -34 -64 -30 -82M10 -40C22 -56 28 -68 24 -84" transform="rotate(45)"/><path d="M-10 -36C-24 -52 -34 -64 -30 -82M10 -40C22 -56 28 -68 24 -84" transform="rotate(135)"/><path d="M-10 -36C-24 -52 -34 -64 -30 -82M10 -40C22 -56 28 -68 24 -84" transform="rotate(225)"/><path d="M-10 -36C-24 -52 -34 -64 -30 -82M10 -40C22 -56 28 -68 24 -84" transform="rotate(315)"/>
          </g>
          <g fill="none" stroke="#ffd990" stroke-opacity=".38" stroke-width="1" stroke-linejoin="round">
            <use href="#lobe" transform="rotate(45) scale(.88)"/><use href="#lobe" transform="rotate(135) scale(.88)"/><use href="#lobe" transform="rotate(225) scale(.88)"/><use href="#lobe" transform="rotate(315) scale(.88)"/>
          </g>
          <circle r="21" fill="#cf8a35" stroke="#8a4d0c" stroke-opacity=".6" stroke-width="1.6"/><circle r="14" fill="url(#og)" stroke="#ffe0a0" stroke-opacity=".6" stroke-width="1.2"/>
        </g>
      </svg>
      <div id="bottle-wrap"><div id="bottle"></div></div>
      <div id="hint" class="hidden"></div>
      <div id="center-msg"></div>
      <div id="timer"></div>
      <svg id="arc-top" class="arc hidden" viewBox="0 0 100 44" aria-hidden="true"><path d="M12 36C28 -2 72 -2 88 36" fill="none" stroke="#6fb52f" stroke-width="8" stroke-linecap="round"/><path d="M12 36C28 -2 72 -2 88 36" fill="none" stroke="#bfe874" stroke-width="2.6" stroke-linecap="round" opacity=".75"/><path d="M88 42L78 30L96 29Z" fill="#6fb52f" stroke="#6fb52f" stroke-width="3" stroke-linejoin="round"/><circle cx="50" cy="9.5" r="9.5" fill="#fff" stroke="#6fb52f" stroke-width="2.4"/><text x="50" y="13.7" text-anchor="middle" font-size="12">💋</text></svg>
      <svg id="arc-bot" class="arc hidden" viewBox="0 0 100 44" aria-hidden="true"><path d="M88 8C72 46 28 46 12 8" fill="none" stroke="#6fb52f" stroke-width="8" stroke-linecap="round"/><path d="M88 8C72 46 28 46 12 8" fill="none" stroke="#bfe874" stroke-width="2.6" stroke-linecap="round" opacity=".75"/><path d="M12 2L22 14L4 15Z" fill="#6fb52f" stroke="#6fb52f" stroke-width="3" stroke-linejoin="round"/><circle cx="50" cy="34.5" r="9.5" fill="#fff" stroke="#6fb52f" stroke-width="2.4"/><text x="50" y="38.7" text-anchor="middle" font-size="12">💋</text></svg>
      <div id="kiss-fx" class="hidden">💋</div>
      <div id="seats"></div>
      <div id="actions"></div>
    </div>
  </section>

  <section id="bottom">
    <div id="chat-panel">
      <div id="chat"></div>
      <div id="dj-fab"><button data-k="video" aria-label="video">🎬</button><button data-k="music_now" aria-label="music">🎧</button></div>
      <div id="player" class="hidden">
        <div class="pl-top"><div id="pl-cover" class="av-mini round-cover"></div><svg class="boombox" viewBox="0 0 120 60"><defs><radialGradient id="sp" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#777"/><stop offset=".5" stop-color="#2a2a2c"/><stop offset="1" stop-color="#111"/></radialGradient></defs><rect x="2" y="8" width="116" height="48" rx="5" fill="#2e2e31" stroke="#111" stroke-width="2"/><rect x="30" y="2" width="60" height="8" rx="3" fill="none" stroke="#222" stroke-width="3"/><circle cx="22" cy="33" r="15" fill="url(#sp)" stroke="#111" stroke-width="2"/><circle cx="22" cy="33" r="5" fill="#333" stroke="#777"/><circle cx="98" cy="33" r="15" fill="url(#sp)" stroke="#111" stroke-width="2"/><circle cx="98" cy="33" r="5" fill="#333" stroke="#777"/><rect x="42" y="18" width="36" height="16" rx="2" fill="#d9d9d4" stroke="#111"/><circle cx="52" cy="26" r="4" fill="#555"/><circle cx="68" cy="26" r="4" fill="#555"/><rect x="42" y="38" width="36" height="12" rx="2" fill="#44484d"/><circle cx="48" cy="44" r="2.2" fill="#e8873a"/><circle cx="56" cy="44" r="2.2" fill="#9be04a"/><circle cx="64" cy="44" r="2.2" fill="#ddd"/><circle cx="72" cy="44" r="2.2" fill="#ddd"/></svg></div>
        <div class="pl-info"><b id="pl-title"></b><small id="pl-by"></small></div>
        <div class="pl-vol"><span id="pl-icon">🔇</span><input id="pl-range" type="range" min="0" max="100" value="0"></div>
      </div>
      <div id="emoji-row" class="hidden"></div>
      <form id="chat-form"><button type="button" id="emoji-btn" class="emo">😊</button><input id="chat-input" maxlength="200" autocomplete="off"><button class="send">➤</button></form>
    </div>
    <div id="gest-panel" class="hidden">
      <div class="gp-head"><div class="av-mini gh-user">👤</div><div class="gp-title"><span id="gs-label"></span></div><button id="gs-smiles" class="smiles-pill"><span>😊</span><b id="gs-n">0</b><i>+</i></button></div>
      <div id="gest-grid"></div>
      <button id="gs-close" class="close-fab">✕</button>
    </div>
    <div id="bottle-panel" class="hidden">
      <div class="gp-head"><div class="gp-title"><span id="bp-label"></span></div></div>
      <div id="bottle-grid"></div>
      <button id="bp-close" class="close-fab">✕</button>
    </div>
    <div id="gift-panel" class="hidden">
      <div class="gp-head"><div id="gp-av" class="av-mini"></div><div class="gp-title"><span id="gp-label"></span><b id="gp-name"></b></div><button id="gp-plus" class="plus">+</button></div>
      <div id="gift-grid"></div>
      <button id="gp-close" class="close-fab">✕</button>
    </div>
  </section>
</div>

<div id="modal-root"></div>
<div id="toasts"></div>
<svg id="art-defs" width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a0"/><stop offset=".5" stop-color="#f2b92e"/><stop offset="1" stop-color="#c47f0e"/></linearGradient>
  <linearGradient id="gRed" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7b6b"/><stop offset=".55" stop-color="#e5374a"/><stop offset="1" stop-color="#a8101f"/></linearGradient>
  <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b6f06a"/><stop offset=".55" stop-color="#4fbf3f"/><stop offset="1" stop-color="#26802c"/></linearGradient>
  <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bff0ff"/><stop offset=".5" stop-color="#4fa8ff"/><stop offset="1" stop-color="#2459c9"/></linearGradient>
  <linearGradient id="gPink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd1e4"/><stop offset=".55" stop-color="#ff7fb2"/><stop offset="1" stop-color="#d6366f"/></linearGradient>
  <linearGradient id="gYellow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6a8"/><stop offset=".55" stop-color="#ffd23d"/><stop offset="1" stop-color="#e5a200"/></linearGradient>
  <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc56b"/><stop offset=".55" stop-color="#ff8a1f"/><stop offset="1" stop-color="#c0430a"/></linearGradient>
  <linearGradient id="gBrown" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6b078"/><stop offset=".55" stop-color="#b9763a"/><stop offset="1" stop-color="#7a4518"/></linearGradient>
  <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d6b8ff"/><stop offset=".55" stop-color="#8e4fe0"/><stop offset="1" stop-color="#5a24a8"/></linearGradient>
  <linearGradient id="gWine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8325e"/><stop offset="1" stop-color="#5a0f2e"/></linearGradient>
  <linearGradient id="gAmber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6b44a"/><stop offset="1" stop-color="#b8650f"/></linearGradient>
  <filter id="bevel" x="-6%" y="-6%" width="112%" height="112%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="b"/>
    <feSpecularLighting in="b" surfaceScale="2.2" specularConstant=".32" specularExponent="16" lighting-color="#fff2d0" result="s"><feDistantLight azimuth="235" elevation="55"/></feSpecularLighting>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
    <feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".7" k4="0"/>
  </filter>
  <filter id="gloss" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.7" result="b"/>
    <feSpecularLighting in="b" surfaceScale="4" specularConstant=".75" specularExponent="26" lighting-color="#fff" result="s"><feDistantLight azimuth="235" elevation="52"/></feSpecularLighting>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
    <feComposite in="SourceGraphic" in2="s2" operator="arithmetic" k1="0" k2="1" k3=".85" k4="0" result="lit"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="sh"/><feOffset in="sh" dx="1.2" dy="2" result="sho"/>
    <feComponentTransfer in="sho" result="sh2"><feFuncA type="linear" slope=".38"/></feComponentTransfer>
    <feMerge><feMergeNode in="sh2"/><feMergeNode in="lit"/></feMerge>
  </filter>
</defs></svg>
